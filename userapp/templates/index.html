
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2, #2b5876);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px 35px;
      border-radius: 20px;

      /* Glassmorphism Effect */
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
      letter-spacing: 2px;
    }

    input, textarea {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.18);
      color: white;
      font-size: 15px;
      transition: 0.3s;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    input:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: white;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    textarea {
      resize: none;
      height: 90px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffffff, #d6dfff);
      color: #5145a5;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      background: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Student</h1>

    <form method="post">
      {% csrf_token %}

      <input type="text" placeholder="Enter Name"
             required name="a">

      <input type="email" placeholder="Enter Email"
             required name="b">

      <input type="tel" placeholder="Enter Mobile no"
             required name="c">

      <input type="text" placeholder="Enter Department"
             required name="d">

      <textarea placeholder="Enter address"
                name="e"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
